name: Release Private Talk

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vMAJOR.MINOR.PATCH, e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Build, Sign & Publish Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and verify release version alignment
        id: meta
        shell: pwsh
        run: |
          $rawTag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if ($rawTag -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "Invalid release tag '$rawTag'. Expected strict vMAJOR.MINOR.PATCH."
          }
          $ver = $Matches[1]

          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriConf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoToml = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value

          if ($pkg -ne $ver -or $tauriConf -ne $ver -or $cargoToml -ne $ver) {
            throw "Version mismatch: tag=$ver package.json=$pkg tauri.conf.json=$tauriConf Cargo.toml=$cargoToml"
          }

          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_TALK_UPDATER_SIGNING_KEY)) {
            throw "Missing required repository secret PRIVATE_TALK_UPDATER_SIGNING_KEY."
          }

          "tag=$rawTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          PRIVATE_TALK_UPDATER_SIGNING_KEY: ${{ secrets.PRIVATE_TALK_UPDATER_SIGNING_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend TypeScript & Vite build gate
        run: npm run build

      - name: Rust security & unit test gate
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          PRIVATE_TALK_UPDATER_PUBKEY: ${{ vars.PRIVATE_TALK_UPDATER_PUBKEY }}
          PRIVATE_TALK_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json

      - name: Build Windows NSIS installer
        run: npx tauri build --bundles nsis
        env:
          PRIVATE_TALK_UPDATER_PUBKEY: ${{ vars.PRIVATE_TALK_UPDATER_PUBKEY }}
          PRIVATE_TALK_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json

      - name: Sign NSIS installer and generate latest.json
        id: sign
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path $nsisDir -Filter "*_${ver}_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Expected NSIS installer for version $ver not found in $nsisDir"
          }

          $targetName = "PrivateTalk_${ver}_x64-setup.exe"
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          $stagedExe = Join-Path "release-assets" $targetName
          Copy-Item -Path $installer.FullName -Destination $stagedExe -Force

          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/${tag}/${targetName}"
          $notes = "Private Talk ${tag} stable Windows desktop release."

          cargo run --manifest-path src-tauri/Cargo.toml --bin sign_release -- `
            --sign-installer $stagedExe `
            --version $ver `
            --url $downloadUrl `
            --notes $notes `
            --out-dir release-assets
        env:
          PRIVATE_TALK_UPDATER_SIGNING_KEY: ${{ secrets.PRIVATE_TALK_UPDATER_SIGNING_KEY }}
          PRIVATE_TALK_UPDATER_PUBKEY: ${{ vars.PRIVATE_TALK_UPDATER_PUBKEY }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Private Talk ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.sig
            release-assets/latest.json
